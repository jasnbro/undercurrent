# undercurrent: homepage work config
#
# Edit this file to change what appears in 01 / WORK. No code changes needed.
#
# tier:       featured | more | side
#               featured: expanded card with a large image (exactly one should be featured)
#               more:     compact row, professional work
#               side:     compact row, personal projects
# order:      sort order within a tier (lower first)
# published:  false hides the entry entirely, for drafts in progress
# image:      required for featured (rendered large); optional for compact rows
#             (rendered as a small thumbnail). alt is required unless decorative: true.
# disclosure: optional line shown under the summary (e.g. AI-built work)
# source:     optional markdown file for a case study page, rendered at link.url.
#             Omit it when the link points to an external project (e.g. Mindless Meals).

works:

  - slug: pipelinetools
    title: pipelinetools
    tagline: making shared logic easier to maintain
    tier: featured
    order: 1
    published: true
    summary:
      - >-
        I consolidated database connectors, credential handling, and
        environment setup into a shared Python library for ETL pipelines.
      - >-
        A Python migration required manual updates to 182 legacy scripts.
        Centralizing that logic gives the team one place to make changes,
        with a managed Python environment to help contain the risk.
    link:
      label: view case study
      url: /work/pipelinetools
    source: content/work/pipelinetools.md
    image:
      src: /images/pipelinetools-architecture.svg
      alt: >-
        PipelineTools architecture: pipelines import one shared library with
        four modules, running on a managed Python environment

  - slug: disputes-refactor
    title: disputes data refactor
    tagline: making disputes data easier to work with
    tier: more
    order: 1
    published: false   # flip to true once the diagram exists
    summary:
      - >-
        I led a refactor of Cash App's disputes reporting, separating two
        versioned tables with competing identifiers into entity tables
        and a reporting mart for analysts.
      - >-
        We validated against source system counts rather than reproducing
        known gaps in the old model, then added ongoing data quality checks.
    link:
      label: view case study
      url: /work/disputes-refactor
    source: content/work/disputes-refactor.md
    image:
      src: /images/disputes-architecture.svg
      alt: >-
        Disputes data model: two versioned tables split into case,
        transaction and customer tables feeding one reporting mart,
        validated against source system counts
 
  - slug: hot-parts
    title: hot parts
    tagline: from one person's PC to the production floor
    tier: more
    order: 2
    published: false   # no diagram needed; flip to true when the copy is final
    summary:
      - >-
        I reverse-engineered a Mercedes-Benz plant's Access database and
        designed the data model for a web application that gives staff
        near real-time visibility of parts on the production floor.
    link:
      label: view case study
      url: /work/hot-parts
    source: content/work/hot-parts.md
  
  - slug: cash-bonus
    title: cash bonus
    tagline: understanding why a customer qualified
    tier: featured
    order: 2
    published: false   # when the diagram exists: flip to true, and set pipelinetools to tier: more
    summary:
      - >-
        I designed and built a cash bonus pipeline that records eligibility
        and reward decisions with version history and reason codes.
      - >-
        Before paying, the pipeline checks prior rewards. Anyone already
        rewarded is disqualified with a reason code, so a rerun doesn't pay
        twice.
    link:
      label: view case study
      url: /work/cash-bonus
    source: content/work/cash-bonus.md
    image:
      src: /images/cash-bonus-architecture.svg
      alt: >-
        Cash Bonus pipeline: versioned campaign terms feed eligibility, tier
        tracking and rewards stages with a reason code on every row, and a
        prior reward check disqualifies customers already rewarded

  - slug: mindless-meals
    title: mindless meals
    tagline: fewer decisions at mealtime
    tier: side
    order: 1
    published: true
    summary:
      - >-
        A recipe library and meal planner for finding meals I already enjoy,
        discovering new ones, and deciding what to cook for the week.
    disclosure: I designed the app; AI coding agents built it under my direction.
    link:
      label: view project
      url: https://meals.undercurrentlabs.dev/

  - slug: gym-log
    title: gym log
    tagline: a workout plan I can change without changing the app
    tier: side
    order: 2
    published: true
    summary:
      - >-
        I wanted to change my workout plan without changing the app. Plans,
        exercises, and equipment live in YAML validated by CI. Postgres
        records the workouts I complete.
    disclosure: I designed the app; AI coding agents built it under my direction.
    link:
      label: view project
      url: https://gym.undercurrentlabs.dev/
