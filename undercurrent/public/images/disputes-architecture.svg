<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Disputes data refactor: Salesforce, Snowflake JSON events and Google Sheets feed the refactored model, where case, transaction and customer tables each have one canonical identifier and feed a reporting mart with shared joins built once for analysts. The model was checked against source system counts before cutover and monitored with data quality checks afterward.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a94a8"/>
    </marker>
    <style>
      .mono { font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace; }
      .serif { font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif; }
      .box { fill: none; stroke: #cfc6b4; stroke-width: 1; }
      .outer { fill: none; stroke: #7d778b; stroke-width: 1; }
      .mod { fill: #2e2b38; stroke: #d9e36b; stroke-width: 1; }
      .label { fill: #e8e0d0; font-size: 14px; }
      .sub { fill: #9a94a8; font-size: 11.5px; }
      .muted { fill: #7d778b; }
      .accent { fill: #d9e36b; }
      .line { stroke: #9a94a8; stroke-width: 1; fill: none; }
      .rule { stroke: #3a3644; stroke-width: 1; }
    </style>
  </defs>

  <rect width="900" height="620" fill="#24212c"/>

  <text x="40" y="44" class="mono sub" letter-spacing="1">DISPUTES / DATA MODEL</text>

  <!-- sources -->
  <text x="40" y="100" class="mono sub muted" letter-spacing="1">SOURCES</text>
  <rect x="40" y="150" width="150" height="56" class="box"/>
  <text x="115" y="183" text-anchor="middle" class="mono label">salesforce</text>
  <rect x="40" y="230" width="150" height="56" class="box"/>
  <text x="115" y="254" text-anchor="middle" class="mono label">snowflake</text>
  <text x="115" y="273" text-anchor="middle" class="mono sub">json events</text>
  <rect x="40" y="310" width="150" height="56" class="box"/>
  <text x="115" y="343" text-anchor="middle" class="mono label">google sheets</text>

  <path d="M190,178 L226,178" class="line" marker-end="url(#arrow)"/>
  <path d="M190,258 L226,258" class="line" marker-end="url(#arrow)"/>
  <path d="M190,338 L226,338" class="line" marker-end="url(#arrow)"/>

  <!-- the big nasty, refactored -->
  <rect x="230" y="116" width="470" height="300" class="outer"/>
  <text x="254" y="154" class="serif" font-size="26" fill="#e8e0d0">the big nasty, refactored</text>

  <rect x="254" y="186" width="170" height="56" class="box"/>
  <text x="339" y="210" text-anchor="middle" class="mono label">cases</text>
  <text x="339" y="229" text-anchor="middle" class="mono sub">one canonical id</text>
  <rect x="254" y="258" width="170" height="56" class="box"/>
  <text x="339" y="282" text-anchor="middle" class="mono label">transactions</text>
  <text x="339" y="301" text-anchor="middle" class="mono sub">one canonical id</text>
  <rect x="254" y="330" width="170" height="56" class="box"/>
  <text x="339" y="354" text-anchor="middle" class="mono label">customers</text>
  <text x="339" y="373" text-anchor="middle" class="mono sub">one canonical id</text>

  <path d="M424,214 L470,262" class="line" marker-end="url(#arrow)"/>
  <path d="M424,286 L470,286" class="line" marker-end="url(#arrow)"/>
  <path d="M424,358 L470,310" class="line" marker-end="url(#arrow)"/>

  <rect x="474" y="226" width="200" height="120" class="mod"/>
  <text x="492" y="274" class="serif" font-size="25" fill="#e8e0d0">reporting mart</text>
  <text x="492" y="300" class="mono sub">shared joins, built once</text>
  <text x="492" y="320" class="mono sub">cleaned history</text>

  <!-- consumers -->
  <text x="740" y="100" class="mono sub muted" letter-spacing="1">CONSUMERS</text>
  <path d="M674,286 L736,286" class="line" marker-end="url(#arrow)"/>
  <rect x="740" y="258" width="130" height="56" class="box"/>
  <text x="805" y="291" text-anchor="middle" class="mono label">analysts</text>

  <!-- checks -->
  <line x1="40" y1="452" x2="870" y2="452" class="rule"/>
  <text x="40" y="484" class="mono sub muted" letter-spacing="1">HOW WE CHECKED IT</text>
  <rect x="40" y="500" width="405" height="64" class="mod"/>
  <text x="64" y="528" class="mono label accent">source system counts</text>
  <text x="64" y="550" class="mono sub">before cutover, instead of the old tables</text>
  <rect x="465" y="500" width="405" height="64" class="box"/>
  <text x="489" y="528" class="mono label">data quality checks (anomalo)</text>
  <text x="489" y="550" class="mono sub">after cutover, ongoing</text>

  <text x="40" y="604" class="mono sub muted">snowflake · prefect · 2022–2023</text>
</svg>
