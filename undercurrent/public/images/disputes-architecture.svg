<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Disputes data refactor in three steps: two versioned tables with competing identifiers were split into case, transaction and customer tables with one canonical identifier each, which feed one reporting mart where shared joins are built once for analysts. The model was checked against source system counts before cutover and monitored with data quality checks afterward.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a94a8"/>
    </marker>
    <style>
      .mono { font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace; }
      .serif { font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif; }
      .box { fill: none; stroke: #cfc6b4; stroke-width: 1; }
      .dashed { stroke-dasharray: 5 5; stroke: #7d778b; }
      .mod { fill: #2e2b38; stroke: #d9e36b; stroke-width: 1; }
      .label { fill: #e8e0d0; font-size: 14px; }
      .sub { fill: #9a94a8; font-size: 11.5px; }
      .muted { fill: #7d778b; }
      .accent { fill: #d9e36b; }
      .line { stroke: #9a94a8; stroke-width: 1; fill: none; }
      .rule { stroke: #3a3644; stroke-width: 1; }
    </style>
  </defs>

  <rect width="900" height="620" fill="#24212c"/>

  <text x="60" y="44" class="mono sub" letter-spacing="1">DISPUTES / DATA MODEL</text>

  <!-- step labels -->
  <text x="60" y="100" class="mono sub muted" letter-spacing="1">01 / BEFORE</text>
  <text x="340" y="100" class="mono sub muted" letter-spacing="1">02 / SPLIT BY ENTITY</text>
  <text x="620" y="100" class="mono sub muted" letter-spacing="1">03 / BUILD ONCE</text>

  <!-- 01 before -->
  <rect x="60" y="116" width="220" height="250" class="box dashed"/>
  <text x="80" y="162" class="serif" font-size="27" fill="#9a94a8">the big nasty</text>
  <text x="80" y="196" class="mono sub">two versioned tables</text>
  <text x="80" y="216" class="mono sub">50+ columns</text>
  <text x="80" y="236" class="mono sub">competing ids</text>
  <text x="80" y="290" class="mono sub muted">same joins rebuilt</text>
  <text x="80" y="308" class="mono sub muted">in every analyst query</text>

  <path d="M284,241 L334,241" class="line" marker-end="url(#arrow)"/>

  <!-- 02 entities -->
  <rect x="340" y="116" width="220" height="70" class="box"/>
  <text x="450" y="146" text-anchor="middle" class="mono label">cases</text>
  <text x="450" y="168" text-anchor="middle" class="mono sub">one canonical id</text>
  <rect x="340" y="206" width="220" height="70" class="box"/>
  <text x="450" y="236" text-anchor="middle" class="mono label">transactions</text>
  <text x="450" y="258" text-anchor="middle" class="mono sub">one canonical id</text>
  <rect x="340" y="296" width="220" height="70" class="box"/>
  <text x="450" y="326" text-anchor="middle" class="mono label">customers</text>
  <text x="450" y="348" text-anchor="middle" class="mono sub">one canonical id</text>

  <path d="M560,151 L614,204" class="line" marker-end="url(#arrow)"/>
  <path d="M560,241 L614,241" class="line" marker-end="url(#arrow)"/>
  <path d="M560,331 L614,278" class="line" marker-end="url(#arrow)"/>

  <!-- 03 mart -->
  <rect x="620" y="176" width="220" height="130" class="mod"/>
  <text x="640" y="220" class="serif" font-size="27" fill="#e8e0d0">reporting mart</text>
  <text x="640" y="250" class="mono sub">shared joins, built once</text>
  <text x="640" y="270" class="mono sub">cleaned history</text>

  <path d="M730,306 L730,342" class="line" marker-end="url(#arrow)"/>
  <rect x="620" y="346" width="220" height="44" class="box"/>
  <text x="730" y="373" text-anchor="middle" class="mono label">analysts</text>

  <!-- checks -->
  <line x1="60" y1="440" x2="840" y2="440" class="rule"/>
  <text x="60" y="474" class="mono sub muted" letter-spacing="1">HOW WE CHECKED IT</text>
  <rect x="60" y="490" width="380" height="64" class="mod"/>
  <text x="84" y="518" class="mono label accent">source system counts</text>
  <text x="84" y="540" class="mono sub">before cutover, instead of the old tables</text>
  <rect x="460" y="490" width="380" height="64" class="box"/>
  <text x="484" y="518" class="mono label">data quality checks (anomalo)</text>
  <text x="484" y="540" class="mono sub">after cutover, ongoing</text>

  <text x="60" y="600" class="mono sub muted">snowflake · prefect · 2022–2023</text>
</svg>
