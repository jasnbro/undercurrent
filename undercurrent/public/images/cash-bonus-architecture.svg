<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Cash Bonus architecture, read left to right. Versioned campaign terms feed a decision history with three stages. Eligibility checks the account when it opens: promo code, account type, customer, anti-gaming and offer period. Tracking checks whether the customer met the tier: direct deposits, average balance, statement cycles, transactions and the tracking window. Reward re-checks the account right before paying: still eligible, promo code, account status, customer, prior rewards, reward window and the top-tier amount. Every failed check records a reason code. Reward-ready accounts drive customer notifications and the business export of rewards to pay.">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#9a94a8"/>
    </marker>
    <style>
      .mono { font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace; }
      .label { font-size: 14px; fill: #e8e0d0; }
      .sec { font-size: 11.5px; fill: #9a94a8; }
      .item { font-size: 11.5px; fill: #cfc6b4; }
      .accent { fill: #d9e36b; }
      .muted { fill: #7d778b; }
      .box { fill: none; stroke: #cfc6b4; stroke-width: 1; }
      .hi { fill: #2e2b38; stroke: #d9e36b; stroke-width: 1; }
      .line { fill: none; stroke: #9a94a8; stroke-width: 1; }
      .rule { stroke: #4a4555; stroke-width: 1; }
    </style>
  </defs>

  <rect width="900" height="620" fill="#24212c"/>

  <text x="40" y="44" class="mono sec" letter-spacing="1">CASH BONUS / ARCHITECTURE</text>

  <!-- input -->
  <rect x="40" y="284" width="140" height="60" class="box"/>
  <text x="52" y="310" class="mono label">campaign terms</text>
  <text x="52" y="330" class="mono sec">versioned</text>

  <!-- decision history -->
  <rect x="200" y="96" width="500" height="404" class="hi"/>
  <text x="220" y="126" class="mono label">decision history</text>
  <text x="220" y="146" class="mono sec">every yes and every no, versioned</text>

  <!-- eligibility -->
  <rect x="220" y="164" width="142" height="300" class="box"/>
  <text x="234" y="190" class="mono label">eligibility</text>
  <text x="234" y="210" class="mono sec">at account open</text>
  <line x1="234" y1="226" x2="348" y2="226" class="rule"/>
  <text x="234" y="250" class="mono item">promo code</text>
  <text x="234" y="272" class="mono item">account type</text>
  <text x="234" y="294" class="mono item">customer</text>
  <text x="234" y="316" class="mono item">anti-gaming</text>
  <text x="234" y="338" class="mono item">offer period</text>
  <text x="234" y="446" class="mono sec">fail → reason</text>

  <!-- tracking -->
  <rect x="382" y="164" width="142" height="300" class="box"/>
  <text x="396" y="190" class="mono label">tracking</text>
  <text x="396" y="210" class="mono sec">met the tier?</text>
  <line x1="396" y1="226" x2="510" y2="226" class="rule"/>
  <text x="396" y="250" class="mono item">direct deposits</text>
  <text x="396" y="272" class="mono item">avg balance</text>
  <text x="396" y="294" class="mono item">statement cycles</text>
  <text x="396" y="316" class="mono item">transactions</text>
  <text x="396" y="338" class="mono item">tracking window</text>
  <text x="396" y="446" class="mono sec">tier met → reward</text>

  <!-- reward -->
  <rect x="544" y="164" width="142" height="300" class="box"/>
  <text x="558" y="190" class="mono label">reward</text>
  <text x="558" y="210" class="mono sec">before paying</text>
  <line x1="558" y1="226" x2="672" y2="226" class="rule"/>
  <text x="558" y="250" class="mono item">still eligible</text>
  <text x="558" y="272" class="mono item">promo code</text>
  <text x="558" y="294" class="mono item">account status</text>
  <text x="558" y="316" class="mono item">customer</text>
  <text x="558" y="338" class="mono item accent">prior rewards</text>
  <text x="558" y="360" class="mono item">reward window</text>
  <text x="558" y="382" class="mono item">top-tier amount</text>
  <text x="558" y="428" class="mono sec">pass → ready</text>
  <text x="558" y="446" class="mono sec">fail → reason</text>

  <path d="M180 314 H218" class="line" marker-end="url(#arrow)"/>
  <path d="M362 314 H380" class="line" marker-end="url(#arrow)"/>
  <path d="M524 314 H542" class="line" marker-end="url(#arrow)"/>

  <text x="220" y="486" class="mono sec accent" font-size="14">a reason code on every no</text>

  <!-- downstream -->
  <path d="M686 314 H712 V258 H728" class="line" marker-end="url(#arrow)"/>
  <path d="M712 314 V370 H728" class="line" marker-end="url(#arrow)"/>

  <rect x="730" y="230" width="150" height="56" class="box"/>
  <text x="742" y="254" class="mono label">notifications</text>
  <text x="742" y="273" class="mono sec">customer messages</text>

  <rect x="730" y="342" width="150" height="56" class="box"/>
  <text x="742" y="366" class="mono label">business export</text>
  <text x="742" y="385" class="mono sec">rewards to pay</text>

  <text x="40" y="604" class="mono sec muted">sql · in production</text>
</svg>
